<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Productos - Sistema de Gestión de Ventas</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body>
  <header><h1>Sistema de Gestión de Ventas</h1><p>Administración de productos</p></header>
  <nav><a href="index.html">Inicio</a><a href="clientes.html">Clientes</a><a href="productos.html">Productos</a><a href="ventas.html">Ventas</a></nav>
  <main>
    <section class="bienvenida"><h2>Productos registrados</h2><p>Administra los productos disponibles en el sistema.</p></section>
    <section class="formulario">
      <h2 id="tituloFormularioProducto">Registrar producto</h2>
      <form id="formProducto"><input type="hidden" id="idProducto">
        <label for="modelo">Modelo</label><input id="modelo" required>
        <label for="marca">Marca</label><input id="marca" required>
        <label for="almacenamiento">Almacenamiento</label><input id="almacenamiento" placeholder="Ej. 128gb" required>
        <label for="color">Color</label><input id="color" required>
        <label for="precio">Precio (COP)</label><input id="precio" type="number" min="0" step="0.01" required>
        <label for="stock">Stock</label><input id="stock" type="number" min="0" step="1" required>
        <button type="submit" id="botonProducto">Registrar producto</button><button type="button" id="cancelarEdicionProducto" hidden>Cancelar edición</button><p id="mensajeProducto" role="status"></p>
      </form>
    </section>
    <section><h2 style="text-align:center;margin:20px 0;">Inventario</h2><div class="tarjetas" id="listaProductos"><p>Cargando productos...</p></div></section>
  </main><footer><p>Sistema de Gestión de Ventas - Proyecto ADSO</p></footer>
</body></html>
