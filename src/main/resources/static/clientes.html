<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Sistema de Gestión de Ventas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header><h1>Sistema de Gestión de Ventas</h1><p>Administración de clientes</p></header>
    <nav><a href="index.html">Inicio</a><a href="clientes.html">Clientes</a><a href="productos.html">Productos</a><a href="ventas.html">Ventas</a></nav>
    <main>
        <section class="formulario">
            <h2 id="tituloFormularioCliente">Registrar cliente</h2>
            <form id="formCliente">
                <input type="hidden" id="idCliente">
                <label for="nombre">Nombre completo</label><input type="text" id="nombre" placeholder="Ingrese el nombre" required>
                <label for="correo">Correo electrónico</label><input type="email" id="correo" placeholder="Ingrese el correo" required>
                <label for="telefono">Teléfono</label><input type="tel" id="telefono" placeholder="Ingrese el teléfono" required>
                <label for="direccion">Dirección</label><input type="text" id="direccion" placeholder="Ingrese la dirección" required>
                <button type="submit" id="botonCliente">Registrar cliente</button>
                <button type="button" id="cancelarEdicionCliente" hidden>Cancelar edición</button>
                <p id="mensaje" role="status"></p>
            </form>
        </section>
        <section><h2 style="text-align:center;margin:20px 0;">Clientes registrados</h2><div class="tarjetas" id="listaClientes"><p>Cargando clientes...</p></div></section>
    </main>
    <footer><p>Sistema de Gestión de Ventas - Proyecto ADSO</p></footer>
</body>
</html>
