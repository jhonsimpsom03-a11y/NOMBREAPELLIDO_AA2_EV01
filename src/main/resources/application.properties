spring.application.name=tienda-celulares
server.port=8080

# Configura estas variables de entorno en tu equipo antes de ejecutar:
# DB_URL=jdbc:mariadb://localhost:3306/tienda_celulares
# DB_USER=tu_usuario
# DB_PASSWORD=tu_contrasena
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tienda_celulares}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jackson.serialization.write-dates-as-timestamps=false
